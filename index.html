<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuldeep Editing Studio - Aligarh No.1 Wedding Photo Editing Store</title>
<meta name="description" content="Kuldeep Studio Aligarh - Best Wedding Photo Editing, Couple Editing, Background Change, Premium Print. Order Online. Call 9368638452">
<meta name="keywords" content="Kuldeep Studio Aligarh, Wedding Editing Aligarh, Photo Editing Aligarh, Kuldeep Editing">
<meta name="google-site-verification" content="google">
<meta property="og:title" content="Kuldeep Editing Studio - Aligarh">
<meta property="og:description" content="No.1 Photo Editing Store in Aligarh - 5000+ Happy Customers">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.header{background:linear-gradient(135deg,#ff2e63,#ff8a00);color:white;padding:15px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px}.nav{display:flex;gap:10px}.nav button{padding:8px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer}.cat-bar{background:white;padding:10px;display:flex;gap:8px;overflow:auto;border-bottom:2px solid #eee}.cat-bar button{padding:8px 16px;border:1px solid #ff2e63;border-radius:20px;background:white;white-space:nowrap;cursor:pointer}.cat-bar button.active{background:#ff2e63;color:white}.shop{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:15px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.1)}.card img{width:100%;height:150px;object-fit:cover}.card-body{padding:10px}.price{color:#ff2e63;font-weight:900;font-size:18px}.card-body button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:8px;font-weight:700;cursor:pointer}.add-cart{background:#000;color:white}.order{background:#25D366;color:white}.admin{max-width:900px;margin:20px auto;background:white;padding:20px;border-radius:12px;display:none}.admin input,.admin select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}.admin button{padding:10px 18px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:5px}.btn-add{background:#ff2e63;color:white;width:100%}.cart-box{position:fixed;bottom:20px;right:20px;background:black;color:white;padding:15px 20px;border-radius:30px;font-weight:900;cursor:pointer;z-index:200}#cartModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:300;justify-content:center;align-items:center}#cartContent{background:white;width:90%;max-width:400px;border-radius:12px;padding:20px;max-height:80vh;overflow:auto}.pay-btn{width:100%;padding:12px;border:none;border-radius:10px;margin-top:8px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo">KULDEEP STORE</div><div class="nav"><button onclick="showShop()" style="background:white;color:#ff2e63">Shop</button><button onclick="showAdmin()" style="background:gold">Manage ⚙️</button></div></div>
<div class="cat-bar" id="catBar"><button class="active" onclick="filterCat('All')">All</button><button onclick="filterCat('Wedding')">Wedding</button><button onclick="filterCat('Couple')">Couple</button><button onclick="filterCat('Background')">Background</button><button onclick="filterCat('Print')">Print</button></div>
<div class="shop" id="shop"></div>
<div class="admin" id="admin"><h2>⚙️ Manage Store</h2><input id="pName" placeholder="Product Name"><input id="pPrice" type="number" placeholder="Price"><select id="pCat"><option>Wedding</option><option>Couple</option><option>Background</option><option>Print</option></select><input id="pImg" placeholder="Image Link"><button class="btn-add" onclick="addProduct()">+ Add Product - Save</button><div id="adminList"></div><button onclick="showShop()" style="background:black;color:white;width:100%;margin-top:15px">Back to Shop</button></div>
<div class="cart-box" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
<div id="cartModal"><div id="cartContent"><h3>Your Order</h3><div id="cartItems"></div><h3>Total: ₹<span id="cartTotal">0</span></h3><button class="pay-btn" style="background:#25D366;color:white" onclick="payWhatsApp()">WhatsApp Order</button><button class="pay-btn" style="background:#008cff;color:white" onclick="payUPI()">UPI Pay - 9368638452@ptaxis</button><button class="pay-btn" style="background:black;color:white" onclick="payCOD()">Cash on Delivery</button><button class="pay-btn" style="background:#eee" onclick="closeCart()">Close</button></div></div>
<script>
let products=JSON.parse(localStorage.getItem('kuldeep_products'))||[{name:"Wedding Editing ₹50",price:50,cat:"Wedding",img:"https://images.unsplash.com/photo-1519741497674-611481863552?w=400"},{name:"Couple Editing ₹70",price:70,cat:"Couple",img:"https://images.unsplash.com/photo-1520854221256-17451ccdf07b?w=400"},{name:"Background Change ₹100",price:100,cat:"Background",img:"https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=400"},{name:"Print 12x18 ₹199",price:199,cat:"Print",img:"https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=400"}];
let cart=[];let currentCat='All';
function renderShop(){let shop=document.getElementById('shop');shop.innerHTML='';let filtered=currentCat=='All'?products:products.filter(p=>p.cat==currentCat);filtered.forEach((p,i)=>{shop.innerHTML+=`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.name}</b><br><span style="font-size:12px;background:#ffe0e8;padding:2px 6px;border-radius:10px">${p.cat}</span><div class="price">₹${p.price}</div><button class="add-cart" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button><button class="order" onclick="orderNow(${products.indexOf(p)})">Order Now</button></div></div>`;});}
function filterCat(c){currentCat=c;document.querySelectorAll('.cat-bar button').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');renderShop();}
function addProduct(){let n=document.getElementById('pName').value,p=document.getElementById('pPrice').value,c=document.getElementById('pCat').value,img=document.getElementById('pImg').value;if(!n||!p||!img){alert('Sab bhare');return;}products.push({name:n,price:parseInt(p),cat:c,img:img});localStorage.setItem('kuldeep_products',JSON.stringify(products));renderShop();renderAdmin();alert('Product Add Ho Gaya!');}
function renderAdmin(){let list=document.getElementById('adminList');list.innerHTML='<h4>Manage Products</h4>';products.forEach((p,i)=>{list.innerHTML+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0"><span>${p.name} - ₹${p.price}</span><button onclick="deleteP(${i})" style="background:red;color:white">Delete</button></div>`;});}
function deleteP(i){products.splice(i,1);localStorage.setItem('kuldeep_products',JSON.stringify(products));renderShop();renderAdmin();}
function showAdmin(){document.getElementById('shop').style.display='none';document.getElementById('catBar').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();}
function showShop(){document.getElementById('shop').style.display='grid';document.getElementById('catBar').style.display='flex';document.getElementById('admin').style.display='none';renderShop();}
function addToCart(i){cart.push(products[i]);updateCart();alert('Cart me add ho gaya');}
function orderNow(i){cart=[products[i]];updateCart();openCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.length;let total=cart.reduce((s,p)=>s+p.price,0);document.getElementById('cartTotal').innerText=total;let items=document.getElementById('cartItems');items.innerHTML='';cart.forEach((p,i)=>{items.innerHTML+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0"><span>${p.name}</span><span>₹${p.price}</span></div>`;});}
function openCart(){document.getElementById('cartModal').style.display='flex';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function payWhatsApp(){let total=document.getElementById('cartTotal').innerText;let msg=cart.map(p=>p.name+' ₹'+p.price).join('%0A');window.open(`https://wa.me/919368638452?text=Hi Kuldeep Order:%0A${msg}%0ATotal ₹${total}`);}
function payUPI(){let total=document.getElementById('cartTotal').innerText;window.open(`upi://pay?pa=9368638452@ptaxis&pn=Kuldeep Studio&am=${total}&cu=INR&tn=Order Payment`);}
function payCOD(){alert('Order Confirm! Kuldeep bhai call karenge - 9368638452');closeCart();cart=[];updateCart();}
renderShop();updateCart();
</script>
</body>
</html>
