<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuldeep Shoes - Myntra Style Pro Store</title>
<meta name="description" content="Aligarh No.1 Branded Shoes - Nike Adidas Puma - Search, Size, Color, Wishlist, Reviews, Coupon, Tracking">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}
.header{background:#000;color:#fff;padding:10px 15px;position:sticky;top:0;z-index:100}
.top-row{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}.logo span{color:#ff3b30}
.search-box{margin-top:10px;display:flex;gap:6px}
.search-box input{flex:1;padding:10px;border-radius:8px;border:none}
.search-box button{padding:10px 14px;border:none;border-radius:8px;background:#ff3b30;color:#fff;font-weight:700}
.icons{display:flex;gap:12px;align-items:center}
.icons div{position:relative;cursor:pointer;font-size:20px}
.badge{position:absolute;top:-8px;right:-8px;background:#ff3b30;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px}
.cat-bar{background:#fff;padding:8px;display:flex;gap:7px;overflow:auto;border-bottom:2px solid #ddd;position:sticky;top:98px;z-index:90}
.cat-bar button{padding:7px 14px;border:1px solid #000;border-radius:20px;background:#fff;font-weight:700;cursor:pointer;white-space:nowrap;font-size:12px}.cat-bar button.active{background:#000;color:#fff}
.shop{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,0.1);position:relative}
.stock{position:absolute;top:6px;left:6px;background:#ff3b30;color:#fff;font-size:10px;padding:3px 6px;border-radius:10px;z-index:2}
.wish{position:absolute;top:6px;right:6px;background:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;z-index:2;font-size:16px}
.img-box{position:relative;width:100%;height:160px;overflow:hidden}
.img-box img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:3px}.dots span{width:6px;height:6px;background:rgba(0,0,0,0.3);border-radius:50%}.dots span.active{background:#000}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.arrow.left{left:4px}.arrow.right{right:4px}
.card-body{padding:8px}.brand{font-size:10px;background:#eee;padding:2px 6px;border-radius:8px}
.price{color:#ff3b30;font-weight:900;font-size:16px;margin:3px 0}.old{color:#888;text-decoration:line-through;font-size:11px;margin-left:5px}
.rating{font-size:11px;color:#ffa500}
.card-body button{width:100%;padding:7px;border:none;border-radius:7px;font-weight:800;margin-top:4px;cursor:pointer;font-size:12px}
.add-cart{background:#eee;border:1px solid #000 !important}.order{background:#000;color:#fff}
.admin{max-width:900px;margin:15px auto;background:#fff;padding:15px;border-radius:12px;display:none}
.admin input,.admin select,.admin textarea{width:100%;padding:9px;margin:5px 0;border:1px solid #ccc;border-radius:7px}
.btn-add{background:#000;color:#fff;width:100%;padding:10px;font-weight:800}
.cart-box{position:fixed;bottom:20px;right:15px;background:#000;color:#fff;padding:12px 18px;border-radius:30px;font-weight:900;cursor:pointer;z-index:200;display:flex;gap:10px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:300;justify-content:center;align-items:center;padding:10px}
.modal-content{background:#fff;width:100%;max-width:400px;border-radius:12px;padding:15px;max-height:90vh;overflow:auto}
.view-img{width:100%;height:250px;object-fit:cover;border-radius:10px}
.thumbs{display:flex;gap:5px;margin-top:6px;overflow:auto}.thumbs img{width:50px;height:50px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#000}
.size-box,.color-box{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.size-box span,.color-box span{padding:6px 12px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:12px}.size-box span.active,.color-box span.active{background:#000;color:#fff;border-color:#000}
.pay-btn{width:100%;padding:11px;border:none;border-radius:8px;margin-top:7px;font-weight:900;cursor:pointer}
.coupon{display:flex;gap:6px;margin:8px 0}.coupon input{flex:1;padding:8px;border:1px solid #ccc;border-radius:6px}.coupon button{padding:8px 12px;background:#000;color:#fff;border:none;border-radius:6px}
</style>
</head>
<body>
<div class="header">
<div class="top-row">
<div class="logo">KULDEEP <span>SHOES</span></div>
<div class="icons">
<div onclick="showWishlist()">❤️<span class="badge" id="wishCount">0</span></div>
<div onclick="openCart()">🛒<span class="badge" id="cartCount">0</span></div>
<div onclick="showAdmin()">⚙️</div>
<div onclick="showLogin()" id="userIcon">👤</div>
</div>
</div>
