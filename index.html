<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuldeep Shoes - Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f2f2f2}
.header{background:#000;color:#fff;padding:12px;position:sticky;top:0;z-index:100}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}.logo span{color:#ff3b30}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;padding:10px;border-radius:8px;border:none}
.search button{padding:10px 14px;background:#ff3b30;color:#fff;border:none;border-radius:8px;font-weight:700}
.cat{background:#fff;padding:8px;display:flex;gap:6px;overflow:auto;border-bottom:2px solid #ddd}
.cat button{padding:7px 14px;border:1px solid #000;border-radius:20px;background:#fff;font-weight:700;white-space:nowrap;font-size:12px}.cat button.active{background:#000;color:#fff}
.shop{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
@media(min-width:600px){.shop{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:relative}
.badge-stock{position:absolute;top:6px;left:6px;background:red;color:#fff;font-size:9px;padding:3px 6px;border-radius:10px;z-index:2}
.wish-btn{position:absolute;top:6px;right:6px;background:#fff;border:none;width:26px;height:26px;border-radius:50%;z-index:2}
.imgbox{position:relative;height:150px;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:cover}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#fff;border:none;width:24px;height:24px;border-radius:50%}
.arrow.l{left:5px}.arrow.r{right:5px}
.dots{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.dots span{width:6px;height:6px;background:#00000040;border-radius:50%}.dots span.on{background:#000}
.body{padding:8px}
.price{color:#ff3b30;font-weight:900}
.btn{width:100%;padding:7px;border:none;border-radius:7px;font-weight:700;margin-top:4px;font-size:12px}
.btn1{background:#eee;border:1px solid #000 !important}.btn2{background:#000;color:#fff}
.cartbtn{position:fixed;bottom:15px;right:15px;background:#000;color:#fff;padding:12px 18px;border-radius:30px;font-weight:900;z-index:200}
